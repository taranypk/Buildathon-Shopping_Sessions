name: Benchmark native shopping-session aggregation
on:
  push:
    branches: [codex/native-speed-check]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: public-dev, seed: 1, events: 1000000, clicks: 250000}
          - {name: practice-scale, seed: 13, events: 20000000, clicks: 5000000}
          - {name: final-scale, seed: 29, events: 60000000, clicks: 15000000}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Build image and get organizer downloads
        shell: bash
        run: |
          docker build --platform linux/amd64 -t shopping-memory-check .
          cd "$RUNNER_TEMP"
          base=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          curl -fsSL --retry 2 -o generator.zip "$base/generator.zip"
          echo '78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip' | sha256sum -c
          unzip -q generator.zip
          cargo build --manifest-path generator/Cargo.toml --release
          if [ '${{ matrix.name }}' = public-dev ]; then
            curl -fsSL --retry 2 -o dev-answer.zip "$base/dev-answer.zip"
            curl -fsSL --retry 2 -o starter-polars.zip "$base/starter-polars.zip"
            echo 'c2439e0e2e7456d721852814e9928e077648803d5c57a1760a40c7d3b0864d20  dev-answer.zip' | sha256sum -c
            echo '0faa7a2cb78f78682f606f88748cdf7290622db2ee55a71261091f3e01392d60  starter-polars.zip' | sha256sum -c
            unzip -q dev-answer.zip
            unzip -q starter-polars.zip
          fi
      - name: Generate input
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          generator/target/release/generate --seed '${{ matrix.seed }}' --events '${{ matrix.events }}' --clicks '${{ matrix.clicks }}' --output data
          du -sh data
          df -h .
      - name: Run with a 12 GiB memory cap and no swap
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          mkdir -m 777 output scratch
          /usr/bin/time -f 'container_wall_seconds=%e' docker run --rm --network none \
            --read-only --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 4096 --cpus 4 \
            --memory 12g --memory-swap 12g --user 1000:1000 -e NCPU=4 -e MEM_GB=12 \
            -v "$PWD/data:/data:ro" -v "$PWD/output:/output" -v "$PWD/scratch:/scratch" \
            --entrypoint /bin/sh shopping-memory-check -c '/app/run.sh && { cat /sys/fs/cgroup/memory.peak || true; }'
          du -sh output
      - name: Check public dev output and starter fixtures
        if: matrix.name == 'public-dev'
        shell: bash
        run: |
          docker run --rm --network none \
            -v "$RUNNER_TEMP:/inputs:ro" -v "$PWD/scripts:/checks:ro" \
            --entrypoint python3 shopping-memory-check /checks/compare.py /inputs/output /inputs/dev-answer
          docker run --rm --network none -e NCPU=4 -e SCRATCH_DIR=/tmp \
            -v "$RUNNER_TEMP/starter-polars/fixtures:/fixtures:ro" -v "$PWD/scripts:/checks:ro" \
            --entrypoint python3 shopping-memory-check /checks/run_fixtures.py /fixtures -- python3 /app/pipeline/pipeline.py
      - name: Compare scored and native pipelines on identical practice input
        if: matrix.name == 'practice-scale'
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/scored-src" "$RUNNER_TEMP/scored-output" "$RUNNER_TEMP/scored-scratch"
          git archive 5646ee4e284143d42b0e4e30aa597f97130921d4 | tar -x -C "$RUNNER_TEMP/scored-src"
          docker build -t shopping-scored "$RUNNER_TEMP/scored-src"
          cd "$RUNNER_TEMP"
          /usr/bin/time -f 'baseline_container_wall_seconds=%e' docker run --rm --network none --cpus 4 --memory 12g --memory-swap 12g -e NCPU=4 -v "$PWD/data:/data:ro" -v "$PWD/scored-output:/output" -v "$PWD/scored-scratch:/scratch" shopping-scored
          docker run --rm --network none -v "$RUNNER_TEMP:/inputs:ro" -v "$GITHUB_WORKSPACE/scripts:/checks:ro" --entrypoint python3 shopping-memory-check /checks/compare.py /inputs/output /inputs/scored-output
      - name: Reconcile both output tables
        if: matrix.name != 'public-dev'
        shell: bash
        run: |
          docker run --rm --network none -i -v "$RUNNER_TEMP/output:/output:ro" \
            --entrypoint python3 shopping-memory-check - <<'PY'
          import polars as pl

          users = pl.scan_parquet("/output/user_daily/*.parquet")
          campaigns = pl.scan_parquet("/output/campaign_daily/*.parquet")
          metrics = ["sessions", "revenue_cents"]
          assert users.select(pl.col(metrics).sum()).collect().row(0) == campaigns.select(pl.col(metrics).sum()).collect().row(0)
          assert campaigns.filter(pl.col("campaign_id") != "organic").select(
              pl.col("assisted_sessions").sum() >= pl.col("sessions").sum()
          ).collect().item()
          print("Daily session, revenue, and assist totals reconcile.")
          PY
